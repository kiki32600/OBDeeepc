name: Compilation et publication

# À chaque push sur main : test + compilation. Si VERSION (dans obdeeepc.py) n'a pas encore
# de Release vX.Y.Z, elle est créée automatiquement (tag compris) et proposée aux eeePC.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Python 32 bits (comme l'eeePC et la DLL OpenPort)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86

      - name: Lire VERSION et vérifier si la Release existe déjà
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('obdeeepc.py', encoding='utf-8').read(), re.M).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$V déjà publiée : compilation de contrôle seulement"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Nouvelle version v$V : elle sera publiée"
          fi

      - name: Test rapide en simulation
        run: |
          python obdeeepc.py --cli --sim --duration 3 --csv test_ligneK.csv
          python obdeeepc.py --cli --sim --sim-can --duration 3 --csv test_can.csv
          python obdeeepc.py --analyse test_ligneK.csv

      - name: Fabrication de l'exe (PyInstaller, mode dossier)
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --onedir --windowed --name obdeeepc obdeeepc.py

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/obdeeepc/* -DestinationPath obdeeepc-win32.zip

      - name: Garder l'archive (lancement manuel)
        uses: actions/upload-artifact@v4
        with:
          name: obdeeepc-win32
          path: obdeeepc-win32.zip

      - name: Publier la version
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: obdeeepc ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            obdeeepc-win32.zip
            obdeeepc.py
          generate_release_notes: true
