name: Compilation et publication

# Une version est publiée en poussant un tag vX.Y.Z identique à VERSION dans obdeeepc.py.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Python 32 bits (comme l'eeePC et la DLL OpenPort)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86

      - name: Vérifier que le tag correspond à VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, re
          src = open("obdeeepc.py", encoding="utf-8").read()
          v = re.search(r'^VERSION = "([^"]+)"', src, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert v == tag, f"VERSION {v} dans obdeeepc.py != tag {tag}"
          print("Version", v)

      - name: Test rapide en simulation
        run: |
          python obdeeepc.py --cli --sim --duration 3 --csv test_ligneK.csv
          python obdeeepc.py --cli --sim --sim-can --duration 3 --csv test_can.csv
          python obdeeepc.py --analyse test_ligneK.csv

      - name: Fabrication de l'exe (PyInstaller, mode dossier)
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --onedir --windowed --name obdeeepc obdeeepc.py

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/obdeeepc/* -DestinationPath obdeeepc-win32.zip

      - name: Garder l'archive (lancement manuel)
        uses: actions/upload-artifact@v4
        with:
          name: obdeeepc-win32
          path: obdeeepc-win32.zip

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obdeeepc-win32.zip
            obdeeepc.py
          generate_release_notes: true
